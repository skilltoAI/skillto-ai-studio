<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频片段 · SKillto.ai|工作台</title><link rel="stylesheet" href="css/studio.css"><script src="lib/hls.min.js"></script><script src="js/studio-editor.js" defer></script></head><body class="editor-page"><header class="editor-header"><a class="brand" href="install.html" target="_blank"><img src="img/studio-logo.png" alt=""><span>SKillto.ai<span class="brand-divider">|</span>工作台</span></a><span class="muted">视频片段</span></header><main class="editor-layout"><section class="preview-section"><div class="video-stage"><video id="player" controls playsinline preload="metadata"></video><p id="previewError" hidden></p></div><div class="preview-meta"><span id="properties">正在读取视频属性…</span><button id="playSelection" class="quiet" disabled>▷ 播放选区</button></div><div class="timeline-shell"><div class="timeline-track"><div id="selectionBand"></div><div id="playhead"></div></div><input id="startHandle" class="range-handle" type="range" min="0" max="1" step="0.01" value="0" aria-label="片段开始位置" disabled><input id="endHandle" class="range-handle" type="range" min="0" max="1" step="0.01" value="1" aria-label="片段结束位置" disabled></div><div class="timeline-labels"><span>00:00</span><span id="durationLabel">--:--</span></div><h1 id="mediaTitle">视频预览</h1><p class="muted" id="sourceHost"></p></section><aside class="edit-controls"><span class="eyebrow">保留你需要的部分</span><h2>选择视频区间</h2><label class="check selection-check"><input id="clipEnabled" type="checkbox" disabled><span>仅保留所选片段</span></label><div class="time-fields"><label>开始时间（秒）<input id="startTime" type="number" min="0" step="0.01" value="0" disabled></label><label>结束时间（秒）<input id="endTime" type="number" min="0" step="0.01" disabled></label></div><div class="two-actions compact"><button id="markStart" class="quiet" disabled>当前画面设为起点</button><button id="markEnd" class="quiet" disabled>当前画面设为终点</button></div><div class="selection-summary"><span id="rangeLabel">完整视频</span><strong id="rangeDuration">--:--</strong></div><p id="processingHint" class="small muted">仅导出所选片段；处理前可能先下载完整视频。选段需要本机工作台运行。</p><div class="editor-bottom"><label class="check"><input id="authorized" type="checkbox"><span>我有权下载和保存此视频</span></label><div class="two-actions"><button id="download" class="secondary" disabled>下载</button><button id="workbench" class="primary" disabled>同步到工作台</button></div><p class="small muted">下载：浏览器保存文件。<br>同步到工作台：处理完成后，将所选片段同步至“拉片”。</p><p id="status" role="status" class="status"></p><a id="openRecord" hidden target="_blank" rel="noopener noreferrer">打开拉片并播放</a></div></aside></main></body></html>
