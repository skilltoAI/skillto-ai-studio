<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><script src="connection.js" defer></script><script src="discovery.js" defer></script><script src="page-media.js" defer></script><script src="popup.js" defer></script><title>Skillto.ai工作台</title></head><body>
<header><img src="icons/48.png" alt=""><div><strong>Skillto.ai工作台</strong><small id="version">视频采集 · 拉片</small></div><button id="open" title="打开拉片工作台">↗</button></header>
<nav><span class="selected">视频下载</span><button id="reconnect">重新连接工作台</button></nav>
<main id="downloadPanel"><p id="title">读取当前网页…</p><p id="serviceStatus" class="hint">正在检查拉片服务…</p>
<label class="consent"><input id="authorized" type="checkbox">我有权下载和保存此视频</label>
<button id="download" class="primary">↓ 浏览器下载当前视频到拉片</button>
<div class="tools"><button id="scan">⌕ 扫描页面视频</button><button id="capture">◉ 开启网络发现</button></div>
<p class="hint">开启网络发现后，刷新网页并播放视频，再点击扫描。直播、DRM 暂不支持。</p>
<label for="resources">已发现的资源</label><select id="resources"><option value="">请先扫描</option></select>
<p id="resourceInfo" class="media-info">选择资源后显示视频属性</p>
<button id="preview">预览所选视频</button><video id="previewPlayer" controls playsinline preload="none" hidden></video><p id="previewHint" class="hint" hidden></p>
<button id="downloadResource">下载所选资源</button>
<a id="lastDownload" hidden target="_blank" rel="noopener noreferrer">查看下载状态与播放</a>
<p class="hint">普通视频由 Chrome 直接下载，完成后自动入库；首次使用需允许下载权限。HLS/DASH 所选清单由本机合并。</p></main>
<footer><span id="status" role="status">准备就绪</span></footer></body></html>
