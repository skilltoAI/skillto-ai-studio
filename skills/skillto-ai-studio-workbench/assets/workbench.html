<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拉片 · Skillto-AI-Studio</title><link rel="icon" href="/workbench-logo.png"><link rel="stylesheet" href="/workbench.css"><script src="/workbench.js" defer></script></head><body>
<header><a class="brand" href="/breakdowns"><img src="/workbench-logo.png" alt="">Skillto-AI-Studio</a><nav><a href="/">表格</a><a class="active" href="/breakdowns">拉片</a></nav><a href="/workbench-install">Chrome 插件</a></header>
<div class="workspace"><aside><div class="sidebar-title"><h1>拉片记录</h1><span id="count">0</span></div><input type="search" id="search" placeholder="搜索标题或平台" aria-label="搜索记录"><button class="primary" id="new">＋ 从链接下载</button><div id="records" aria-label="拉片记录列表"></div></aside>
<main id="detail"><div class="empty"><p>你的视频研究，从这里开始</p><span>使用 Chrome 插件下载视频，或从链接创建一条拉片记录。</span></div></main></div>
<dialog id="newDialog"><form id="newForm"><h2>下载视频</h2><label for="url">视频网页或 MP4 / m3u8 / mpd 链接</label><input type="url" id="url" required placeholder="https://"><label class="check"><input type="checkbox" required id="authorized">我有权下载和保存此视频</label><div class="actions"><button type="button" id="cancelNew">取消</button><button class="primary">开始下载</button></div></form></dialog>
<div id="notice" role="status" aria-live="polite"></div></body></html>
