services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: report_admin
      POSTGRES_DB: metabase_app
      POSTGRES_PASSWORD: ${REPORT_DB_PASSWORD:?Set REPORT_DB_PASSWORD in the protected env file}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - report_postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-reports.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_admin -d metabase_app"]
      interval: 5s
      timeout: 3s
      retries: 20
  metabase:
    image: metabase/metabase:v0.64.3.x
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: report_admin
      MB_DB_PASS: ${REPORT_DB_PASSWORD:?Set REPORT_DB_PASSWORD in the protected env file}
      MB_SITE_URL: http://127.0.0.1:3330/
      MB_LOAD_SAMPLE_CONTENT: "false"
    ports:
      - "127.0.0.1:3330:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  report_postgres:
