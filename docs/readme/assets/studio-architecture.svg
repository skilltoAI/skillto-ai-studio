<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Skillto.ai Studio — AI-native and Skill-native architecture</title>
<desc id="desc">Agent hosts use the Studio parent Skill and 18 specialised Skills to call Personal MCP, which provides tools backed by the local Personal Server. The browser and the browser extension use the server's module API. The server owns local records and media. Separately, authorised clients access the Skillto.ai platform for AI assets, APIs, Skills and cloud visual workflows.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
    <stop stop-color="#0b1721"/><stop offset="1" stop-color="#0b1120"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#36475c" opacity=".18"/>
  </pattern>
  <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L10 5 0 10Z" fill="#4ce39a"/>
  </marker>
  <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L10 5 0 10Z" fill="#82aaff"/>
  </marker>
  <marker id="slate-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L10 5 0 10Z" fill="#91a9bc"/>
  </marker>
</defs>
