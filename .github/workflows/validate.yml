name: Validate skill distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      - name: POSIX entry point
        if: runner.os != 'Windows'
        run: sh install.sh --agent claude --destination .install-test/claude --dry-run
      - name: PowerShell entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Agent claude -Destination .install-test/claude -DryRun
